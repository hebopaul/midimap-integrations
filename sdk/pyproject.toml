[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midimap-integration-sdk"
version = "0.1.0"
description = "Author SDK for MIDImap integration packages (draft worker protocol v1)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Exact pins: the SDK validates with the same JSON Schema stack as the host.
dependencies = [
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "referencing==0.36.2",
    "rpds-py==0.27.1",
    "attrs==25.4.0",
    "typing-extensions==4.15.0; python_version < '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]
